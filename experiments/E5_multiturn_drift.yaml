meta:
  id: E5
  version: 0.1.0
  title: 多轮语义漂移与短轮次边界
  stage: 5
  depends_on: [E4]
  status: registered
  owner: workbuddy
  seed: 0

hypotheses:
  h0: 多轮漂移不可接受（10 轮衰减 >5pp），或短轮次场景无优势
  h1: 10 轮衰减 ≤2pp，且 1-2 轮短场景不劣于基线 2pp

config:
  model: V4.1-Flash-1017
  arms:
    - fixed_block_native
    - semantickv_reorg_full    # E1-E4 全量组合
  datasets: [multiturn_dialogue_10_30turn, short_turn_1_2]
  context_lengths: [32768]
  kv_budget_ratio: 0.10
  turns: [10, 20, 30]
  seeds: 3
  max_seeds: 5

metrics:
  primary: decay_pp_per_10_turns   # 每 10 轮性能衰减（百分点）
  direction: lower_is_better
  secondary: [short_turn_delta_pp, reassignment_rate]

thresholds:
  pass_line: 2.0
  falsify_line: 5.0
  auxiliary:
    short_turn_delta_pp: {pass_min: -2.0, falsify_max: -5.0}

stopping_rule:
  type: sequential
  ci_level: 0.95
  check_every: "1 seed"
  max_seeds: 5
  outcomes:
    pass: "10 轮衰减 CI 完全低于 2pp 且短轮次劣势 > -2pp"
    fail: "衰减 CI 完全高于 5pp，或短轮次差 < -5pp -> 限定长对话场景"
    inconclusive: "跨线停留，扩种子"

update_rules:
  on_fail:
    - "锚点身份稳定化（跨轮锚点对齐）"
    - "结构边增援 + 写屏障回放"
    - "仍衰减 -> 方案标注适用边界：仅长对话场景"
  on_pass:
    - "进入 E6 压力测试"
  changelog: results/CHANGELOG.md

artifacts:
  code_commit: ""
  data_version: ""
  log_fields: [turn, topic_switch, decay_pp, anchor_reassignment, group_count]

mock:
  n_tokens: 20000
  dim: 768
  n_topics: 32
  pass_line: 0.90
  falsify_line: 0.80
