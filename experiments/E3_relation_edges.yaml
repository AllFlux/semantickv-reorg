meta:
  id: E3
  version: 0.1.0
  title: 细粒度群间关系编码：top-p 边的必要性
  stage: 3
  depends_on: [E1]
  status: registered
  owner: workbuddy
  seed: 0

hypotheses:
  h0: 细粒度群间边不值得其内存开销
  h1: 细粒度 top-p 边在推理型任务上提升 ≥3pp，且边内存 ≤ 压缩收益的 30%

config:
  model: V4.1-Flash-1017
  arms:
    - no_edges            # 仅群内合并
    - top_p_edges_select  # 选择/剔除式实现
    - top_p_edges_merge   # 合并/关系状态式实现
  edge_top_p: [5, 10, 20]
  datasets: [gsm8k_longctx, kvfundabench_reasoning, longbench_reasoning_subsets]
  context_lengths: [32768, 131072]
  kv_budget_ratio: 0.10
  seeds: 3
  max_seeds: 5

metrics:
  primary: reasoning_delta_pp   # 细粒度边 − 无边缘（百分点）
  direction: higher_is_better
  secondary: [edge_memory_ratio, edge_count]

thresholds:
  pass_line: 3.0
  falsify_line: 1.0
  auxiliary:
    edge_memory_ratio: {pass_max: 0.30, falsify_min: 0.50}

stopping_rule:
  type: sequential
  ci_level: 0.95
  check_every: "1 seed"
  max_seeds: 5
  outcomes:
    pass: "推理型提升 CI 完全高于 3pp 且边内存比 ≤0.30"
    fail: "提升 CI 完全低于 1pp，或内存抵消 >50% -> 否定细粒度必要性"
    inconclusive: "跨线停留，扩种子或细分 top-p 档位"

update_rules:
  on_fail:
    - "边粒度降为 top-p=5/10"
    - "从「合并/关系状态」退回「选择/剔除」"
    - "仍失败 -> 否定细粒度群间关系，只保留群内合并（负结果入档）"
  on_pass:
    - "确定 top-p 档位与实现路线，进入 E4"
  changelog: results/CHANGELOG.md

artifacts:
  code_commit: ""
  data_version: ""
  log_fields: [top_p, edge_count, edge_memory_bytes, reasoning_acc, retrieval_acc]

mock:
  n_tokens: 20000
  dim: 768
  n_topics: 32
  pass_line: 0.90
  falsify_line: 0.80
