meta:
  id: E6
  version: 0.1.0
  title: 压力测试：组合方案在推理/代码任务族的适用边界
  stage: 6
  depends_on: [E5]
  status: registered
  owner: workbuddy
  seed: 0

hypotheses:
  h0: 组合方案在推理/代码任务族无优势
  h1: ≥3/4 任务族不劣于基线，且 ≥2/4 显著优

config:
  model: V4.1-Flash-1017
  arms:
    - fixed_block_native
    - semantickv_reorg_full
  datasets:
    - gsm8k_longctx          # 数学推理
    - repobench              # 代码仓库级
    - longbench_full         # 综合长上下文
    - extreme_phase_scan     # 极端相位扫描（128K 检索）
  context_lengths: [32768, 131072]
  kv_budget_ratio: 0.10
  seeds: 3
  max_seeds: 5

metrics:
  primary: n_families_not_worse    # 不劣于基线的任务族数（0-4）
  direction: higher_is_better
  secondary: [n_families_significantly_better, worst_position_acc]

thresholds:
  pass_line: 3.0
  falsify_line: 2.0
  auxiliary:
    n_families_significantly_better: {pass_min: 2.0}

stopping_rule:
  type: sequential
  ci_level: 0.95
  check_every: "1 seed"
  max_seeds: 5
  outcomes:
    pass: "≥3/4 任务族不劣于基线且 ≥2/4 显著优"
    fail: "推理任务显著差 >3pp -> 否定推理场景，回退固定分块"
    inconclusive: "跨线停留，逐族分析后决定"

update_rules:
  on_fail:
    - "推理/代码任务回退固定分块压缩"
    - "组合方案标注适用边界（任务族清单）"
  on_pass:
    - "形成最终结论页：支持/证伪组件清单 + 适用边界"
  changelog: results/CHANGELOG.md

artifacts:
  code_commit: ""
  data_version: ""
  log_fields: [family, acc, delta_pp, worst_position_acc, kv_bytes]

mock:
  n_tokens: 20000
  dim: 768
  n_topics: 32
  pass_line: 0.90
  falsify_line: 0.80
