verdict_summary: |
  confirmed（按 §4 预登记判据逐条落点，未放宽阈值）。
  机制读数：35 个层单元中 33~34 个的单单元 ±20% 预算内扰动对 composite 的改变量 <0.01；实测敏感度质量高度集中（L1 独占 max-sens 总量的 67%，L24 14.5%，二者合计 81.5%），
  27/35 层在全部 6 档 K 上 |ΔL| ≤ 0.005（冻结件 negligible 档）。故 KV 预算在 33~34 个方向上的重分配对可压性不可分辨——这为 R1「反比/正比分配不能稳定优于均匀」提供了机制解释：
  不是方向错，而是除少数高敏感度层外该方向上的梯度本就不存在。
  未决子项（不影响本轮落点）：「结构性死区」与「测量方差淹没」在现有资产下不可分离（ΔL 无 per-prompt CI；冻结件自述 CI 仅对 flip 可用），见 assets_required。

caveats_and_degeneracies: |
  (1) 饱和：死区集合达 33~35/35，故「重合度」在两种分母下读值不同——|死区∩低敏|/|低敏|=100%（本轮采用，与 prediction「死区集中于低敏感度层」的覆盖口径一致），
      |死区∩低敏|/|死区|=35.3%（集中度口径，落在 30~70% 判据未覆盖带）。请 WB0 钉死分母；若钉为集中度口径，则落点应改判为判据未覆盖（非 confirmed 亦非 refuted）。
  (2) 变体依赖：V2（指令字面补偿规则把补偿压到最高敏感度层 L1）给出 0~20 死区，与主读数相反；该差异源于补偿通道而非被测单元，已按 §2.3 要求显式登记。
  (3) V1 字面网格读数 Δ≡0（分辨率塌缩），与主读数同向但不携带判别信息，不作落点依据。
  (4) 臂间不一致：D 臂在 900 档仅 7 个死区单元（U/P/T 为 34），主读数取 U 臂；臂未在指令中指定，已并列登记四臂。
  (5) 预测第二子句（死区规模随预算收紧而扩大）不获支持（r=+0.64，实际持平）。

