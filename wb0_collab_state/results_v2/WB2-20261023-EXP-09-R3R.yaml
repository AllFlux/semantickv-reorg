verdict_note: >
  M1 主口径下 n_evaluable_primary=66 ≥ 30（门槛满足），且最佳配置 hop=3/K=10/无约束
  PR@5(M1)=1.0 相对 1 跳无约束基线 0.9697 的 Δ=+3.03pp ≥ 2pp（判据条件①成立）；
  但无约束 K=inf 序列为 {1跳:0.9697, 2跳:0.9697, 3跳:1.0}，3 跳即序列峰值，相对峰值下降 0.0pp < 1pp
  （判据条件②不成立，注意力劫持证据缺失）。两条件须同时成立方可 confirmed，故按 D1 三分法记 pending，
  既不因条件①成立而升级为 confirmed，也不因条件②不成立而降为 refuted（refuted 要求 24 组 Δ 全部 <2pp，
  实测存在 Δ=+3.03pp 的配置，该分支不适用）。
  关键限定（如实披露，供 WB0 裁定）：M1 的 66 题中 64 题（96.97%）为 gold∈seed（stratum A），
  其 gold 由 teleport 直接赋分 0.85/|seeds|，在 top-5 中结构性自命中，全部 24 组配置下 stratum A 恒为 1.0，
  无判别力；唯一产生 Δ 的来源是 stratum B（gold∉seed，n=2）在 hop=3 且 K∈{10,inf} 时由 0 变 1（2 题同时）。
  即：本令的样本量提升（2→66）在数值上达成，但判别力仍由 n=2 的子集承担，
  PR@5 步长由 50pp 降至 1.515pp 只是把「2 题即可跨过 2pp 门槛」变成新的脆弱点，并非功效的真实改善。
  附加读数：块对角约束在全部 12 个 (hop,K) 上与无约束 Δ 均为 0.00pp（本口径下块对角对 PR@5 无影响）；
  M2 对照口径在 66 题集合上为 0.0（hop∈{1,2} 全 K）/ 0.0303（hop=3 且 K∈{10,inf}），与 R3 原件
  pr5_goldtitle66 逐组一致；随机基线 PR@5(M1)=0.0040（1404 节点候选，每查询 200 次抽 5）。
