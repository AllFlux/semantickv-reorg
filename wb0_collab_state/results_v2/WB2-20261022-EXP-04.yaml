hypotheses:
  - id: H-DECOUPLE-EXP04
    statement: 结构显著性（k-core）分配的检索增益只在 corr(freq, structure)<0.2 的解耦图上出现，共线图（corr>0.9）无增益。
    status: pending
    prediction: 解耦图 X∈{40,50,60} 的 delta 全部 >= +2pp；共线图平均 |delta| < 1pp。
    falsifiable_criterion: 解耦图任一档 delta < 2pp 即判 refuted；共线图 |delta| >= 1pp 判 partial（频次残余）。
    actual_data: >
      解耦 delta = +56.25 / +65.22 / +68.75 pp（均值 +63.41）；共线 delta = 0.00 / 0.00 / 0.00 pp。
      名义判据满足，但 gold 取自 k-core 顶档（判据与指标同源），随机分配基线已达 0.6087/0.6875/0.6579，
      k-core 与 bridge 一律饱和 1.000（任务 B 全 0.000）→ 任务无区分力，判 pending（不可辨识），不判 confirmed。
  - id: H-WB2-EXP04-TASKDESIGN
    statement: 当 gold 取自结构度量顶档子集时，PR@5 类判据会发生天花板饱和，使"结构分配更优"的结论不可辨识。
    status: confirmed
    prediction: 同拓扑下随机分配的 PR@5 已接近 k-core 分配（差距 < 10pp），且非核心 gold 变体全为 0。
    falsifiable_criterion: 若随机分配 PR@5 低于 k-core 分配 20pp 以上，则本假设被证伪。
    actual_data: >
      随机 0.6087/0.6875/0.6579 vs k-core 1.000/1.000/1.000；差距 31-39pp（低于 20pp 阈值未触发证伪，
      但 k-core 已顶到理论最大 1.000）。非核心 gold 变体：random/k-core/bridge 三档全 0.0000。
      确定性可复现（exp04_ceiling_diag.json）。
  - id: H-WB2-EXP04-KCORE-RHO-CEILING
    statement: 在 k-core 仅 3 个离散取值的 core-periphery 图上，corr(freq, k-core) 的 Spearman |rho| 上限约 0.74，达不到 0.9。
    status: confirmed
    prediction: 任何 freq 重排方案下，|rho| 收敛且不超过 0.80。
    falsifiable_criterion: 若存在任一重排使 rho > 0.80，则本假设被证伪。
    actual_data: >
      40 组加权种子 + 贪心成对交换后 rho 收敛于 0.7403 且不再上升（并列质量占 76%：k-core=3 的 228 节点）；
      解耦侧最低 -0.1000。故指令"共线 corr>0.9"闸门在此拓扑上不可满足。

prediction: >
  若 H-DECOUPLE 成立，则结构显著性（k-core）相对频次分配的检索增益应只在
  corr(freq, structure) < 0.2 的解耦图上出现；在两图共用同一拓扑、仅 freq 取向
  不同的严格对照下，共线图（corr > 0.9）应无增益。预注册方向：
  delta_decoupled >= +2pp（三档预算均满足），delta_collinear 绝对值 < 1pp。

falsifiable_criterion: >
  (1) 解耦图 X∈{40,50,60} 三档 PR@5 的 delta 全部 >= 2pp；
  (2) 共线图平均 |delta| < 1pp；
  (3) 构造闸门：解耦图 |corr(freq, structure)| < 0.2 且共线图 corr > 0.9。
  三条同时成立判 confirmed；解耦 delta < 2pp 判 refuted；
  共线图亦有增益判 partial（频次残余）；闸门未过则不下 confirmed/refuted。

actual_data: >
  构造：两变体共用同一拓扑 n=300 / m=588 / k-core 分布 {11:12, 3:228, 1:60}，
  仅 freq 赋值取向不同（规模混淆被完全排除）。
  corr(freq, k-core)：解耦 -0.090（过 <0.2 闸门），共线 +0.740（未达 >0.9）；
  corr(freq, bridge_score)：解耦 -0.100，共线 +0.741。
  共线图 0.9 门槛未达：k-core 仅 3 个离散取值，强并列下 Spearman |rho| 上限≈0.74，
  该阈值在本拓扑上结构性不可达；按分级口径披露（graded_0_7 = true），未伪称达成。
  PR@5（damping 0.85 / 50 iters / 60 查询 / 有效样本随预算 32→38→44）：
    解耦 freq = 0.4375 / 0.3478 / 0.3125；解耦 k-core = 1.000 / 1.000 / 1.000 → delta = +56.25 / +65.22 / +68.75 pp（均值 +63.41）
    共线 freq = 1.000 / 1.000 / 1.000；共线 k-core = 1.000 / 1.000 / 1.000 → delta = 0.00 / 0.00 / 0.00 pp
  verdict 名义分支为 confirmed_conditional（分级），但被天花板诊断推翻：
    随机排序分配对照 PR@5 = 0.6087 / 0.6875 / 0.6579，k-core 与 bridge 均饱和 1.00；
    任务 B（gold 改为路径上非核心节点，n=60）random/k-core/bridge 三档全部 0.00。
    即任务一撞天花板、一撞地板，主判据在本构造上无区分力。
  最终判定：unidentifiable_task_ceiling_floor。不得据 +63.41pp 宣称机制性增益。
  对 H-WB0-A 的影响：不升不降，维持 pending（既未证实也未证伪）。

