methodological_notes:
  - gold 不得取结构度量的顶档子集，须由任务侧独立定义（真实多跳 QA 的答案实体）。
  - 预算比较前必须先跑随机分配基线；随机已近天花板/地板时，判据无分辨力，应先改任务。
  - 以"与 freq 的相关性"做构造闸门的实验，须事先报告该相关系数在当前拓扑上的上限，
    不可直接套用 0.2 / 0.9。

