    prediction: B.precision_at_5 ≥ A.precision_at_5 + 0.02，且配对 bootstrap CI95 下界 > 0。
    falsifiable_criterion: delta_PR@5 < 0.02 或 CI95 下界 ≤ 0 → refuted。
