      且配对 bootstrap CI95 下界 = 0.000（不可与 0 区分，p_gt_0=0.64）。属预登记证伪，不做事后改判。
    status: refuted
  - id: H-E1L-POWER
    statement: 该轻量代理在 60 实体/30 查询小图上具备足够区分力，可支撑方向性结论。
    prediction: 两档绝对 PR@5 应显著高于随机基线（随机 ≈ 1/60×5 量级），hits@2 至少达双位数。
    falsifiable_criterion: 若两档绝对 PR@5 均 <2% 且 hits@2 ≤ 2，则功效不足，不能据以作方向性结论。
    actual_data: A=0.0077、B=0.0154，hits@2 分别 1/26 与 2/26，均远低于可用区分度 → 功效不足，本条自证。confirmed（功效不足成立）。
    status: confirmed
  - id: H-E1L-TAU
    statement: 结论对 tau 选择稳健（非单一 tau 的偶然）。
    prediction: 校准 tau 附近若干档（群数 11–19）应保持同向且多数达门槛。
    falsifiable_criterion: 若网格内 PR@5 符号翻转或无任一档达门槛，则结论不依赖 tau 选择而是整体弱信号。
    actual_data: p80(11 群,PR@5=0.0077)、p85(15 群,0.0154)、p90(19 群,0.0077)、p95(29 群,0.0077)；p50–p75 为 0.0000。无一档达 +2pp。confirms 整体弱信号。confirmed。
