     supporting-facts 版（可由 supporting-fact 链长派生 hop，属可复现规则），或由 WB0 书面批准的派生 hop 口径
     （派生须登记为派生、不得当原件字段用）；同时需要 gold 到图节点的映射口径（当前 gold 为自然语言答案字符串）。
  2) 打分器：沿用 EXP-05/EXP-11 的 PPR 结构传播打分（d=0.85、50 轮、非神经、无模型前向、无 GPU），
     而非指令 §2.2 提及的 BM25；理由是指令 §1 要求「与合成版逐条对齐」优先，换打分器会破坏对齐。已显式披露。
  3) 单样本集、单打分器、单图构造口径；bootstrap CI 只覆盖题级抽样不确定性，不覆盖打分器/图构造/社区划分的选择不确定性。
  4) X 水平：指令未指定保留率，主口径取中位 X=50，40/60 并列披露；三档结论方向一致（|pooled mean_d| < 0.6pp），
     未作事后挑选，但 X 选择本身未经预登记。
  5) 剔除与偏斜：构造-hop 任务的配对数随 hop 递减（kcore|X50：22/20/13），hop4 功效最弱；hop 分布由 BFS 层可用性决定，
     非均匀设计。
  6) 命名漂移登记：WB0 23:40 裁定（1792943741-aca70f）动作清单把本线写作「EXP-21-CODEBUDGET-RETR」，
     而实际派发令（1792943742-7b5009）的 idempotency_key 为 WB0-INSTR-20261025-EXP-21-REALHOP-STRUCTFREQ；
     本轮按实际派发令执行，差异仅登记，不改变判据。
