  E5 撤回命中（主变体 U 臂 B=900 档 sd=0.0736 / 0.0741 > 0.05，两幅度皆是）。故顶层落 e5_withdrawn，
  hypothesis 落 pending 待裁。方向性事实（不参与落点，仅供裁定）：死区规模随幅度单调收缩
  （U 臂 V5，±20% → ±40% → +60%：B=900 34 → 32 → 17；B=468 34 → 21 → 14；B=612 32 → 0 → 0），覆盖口径重合度随幅度下降
  （mean 76.7% → 58.3%），sd 随幅度上升（0.0325 → 0.0736 → 0.0741），三者一致指向
  「±20% 死区含显著的小扰动分辨率成分」，但预登记的 refuted 计数型触发条件（≤1 档 / ≥3 档 ≥10 单元）未达，
  故不得自行改判，交 WB0 裁定。

caveats_and_degeneracies:
  - 判据语义张力（须裁定）：E5 分支字面为「sd > 0.05 致不可分辨」，但本轮 sd 上升恰恰源于「大幅扰动变得可分辨」
    （B=900 档 |Δ| 上限 0.2747 → 0.6260 随幅度单调放大），与「不可分辨」语义相反。本轮回执按字面判据落 E5，未自行改判；
    建议 WB0 裁定 sd 阈值在幅度扫描场景下的适用方式（是否应只对低预算档生效，或改用 |Δ| 上限口径）。
  - B=612 档反常：U 臂死区单元数在 a=0.40 与 a=0.60 下均为 0，而 ±20% 同档为 34；该档 abs|Δ| 上限仅 0.032，
    即崩塌不是「大幅度 Δ 变大」所致，而是该档基线 profile 恰好使 ±a 扰动后 Δ 落在 0.01~0.032 区间（跨过死区阈值但未超 0.05）。
    这是判据「计数型」设计的盲区，须交 WB0 判是否构成 refuted 的实质证据。
  - 覆盖/集中度口径分离：主口径用覆盖口径（WB0 23:40 档钉死）；集中度口径并列登记（a=0.40 各档 37.5~47.6%，
    a=0.60 各档 29.4~42.9%），不参与落点。若改用集中度口径，两幅度均远低于 70%，落点会变 —— 已按裁定不自行切换。
  - D 臂覆盖口径恒为 0.0%（两幅度、4 个中高预算档）：D 臂死区集合与低敏 12 层无交集，臂间差异显著，仅登记不判。
  - 变体依赖：主变体 V5（水填充）与 EXP-17 主变体 V3（均匀摊还）不同 —— 本轮主变体由本令指定为 V5；
    已在 actual_data.amplitude_control_from_EXP17 给出 V5 在 ±20% 的同档对照，确认 sd 超阈为幅度效应而非变体切换效应。
  - ΔL 无 per-prompt CI：判据为计数型，不能给出效应量置信区间；n 为固定设计的确定性计数，非随机样本。

