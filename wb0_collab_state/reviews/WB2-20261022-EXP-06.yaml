title: EXP-06 语义 Router 课程学习（递增 vs 随机 vs 递减）——码本利用率 exp(H) 与下游 OOD 泛化
status: delivered
verdict: pending
status_note: >-
  按 D1 三分判 pending，核心是**判据前提缺失 + 效应矛盾**，而非单纯样本不足。指令 §3 预注册判据
  （递增课程在 exp(H) 或 OOD 上显著优于随机/递减，≥2pp）在主设置上均未满足：OOD 主设置
  （lp_community × p × online，m=60）d(inc−rnd)=+1.0pp（CI95[−0.3,+2.5] 跨 0）、
  d(inc−dec)=+0.6pp（CI95[0.0,+1.9]）；exp(H) 主设置 m=24 |d|<0.3pp。更关键的是主难度
  （Router 逐样本预测熵）在 17/18 个 Router 上无梯度（H_std<1e-6）→ inc/dec 臂退化为
  索引序/逆序，inc−dec 对比被结构性拉平，confirmed 判据在本批 Router 上近乎不可执行（前提缺失）。
  敏感性扫描（2 任务 × 2 输入 × 2 模式 × 5 预算 × 2 臂 = 32 个显著 delta）存在显著但方向相反
  或幅值远不足的效应（如 lp_community×h×online m=60：d(inc−rnd)=−6.0pp CI[−11.2,−1.0]；
  degree 臂 expH m=24：+0.5~0.8pp），故"课程顺序无显著影响"的全局陈述亦不成立。
  按 D1"测不出≠已证伪"：不写 refuted；未达判据也不写 confirmed → pending。
  n=60 为指令明示边界（功效低，仅机制观察）；实体级留出（同类两 split 可见），社区级未见类 OOD
  对闭集分类器不可计算（已披露）。
prediction: >-
  指令 §3 预注册：若课程顺序对 Router 码本使用与下游泛化有因果影响，则递增课程（easy-first）应在
  exp(H)（码本利用率）或下游 OOD 宏准确率上优于随机与递减课程 ≥2pp（或 ≥10% 相对提升）；
  递减课程（hard-first）应劣于或等同于随机。操作化（WB2 口径，实验前固定）：难度=per-router
  逐样本预测熵 H(p_i)（并列 1e-6 取整稳定排序）；敏感性难度=图 degree（高频=易，方向假设已披露）；
  课程=递增/递减/随机（随机 3 个种子）；预算 m∈{12,24,36,48,60}；指标=前缀 m 样本池化码分布
  exp(H)（util=exp(H)/K，WB1 口径）+ 下游 OOD 宏准确率（线性探针，输入 p 码分布为主）。
falsifiable_criterion: >-
  confirmed ⟺ 主设置（lp_community × p × online）OOD 或 exp(H) 上，递增同时胜随机与递减
  ≥2pp 且配对 bootstrap CI95 下界>0；refuted ⟺ 两臂 |d|<2pp 且 CI 覆盖 0；否则 pending
  （指令 §3：样本不足或矛盾）。附加纪律：主难度臂若结构性退化（绝大多数 Router 无逐样本难度
  梯度），inc−dec 对比不可解释为课程效应，不得据此下任一 verdict（伪重复披露）。
