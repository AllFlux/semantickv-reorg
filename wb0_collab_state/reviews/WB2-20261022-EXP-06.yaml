      按 D1 不写 refuted；(4) 落入指令 §3 pending 分支（矛盾 + n=60 边界）。
  - id: H-EXP-06-DEGENERACY
    statement: 主难度口径（Router 逐样本预测熵）在本批 18 个 Router 上缺乏逐样本梯度，使递增/递减课程对比结构性退化（inc≈dec）。
