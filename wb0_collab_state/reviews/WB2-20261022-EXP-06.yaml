  - id: H-EXP-06-CURRICULUM
    statement: 课程顺序（递增 vs 随机 vs 递减）对 Router 码本利用率（exp(H)）与下游 OOD 宏准确率有因果影响，递增优于随机与递减 ≥2pp。
    status: pending
