      敏感性 32 个显著 delta 方向相反或 <<2pp（如 h×online m=60 −6.0pp；degree 臂 +0.5~0.8pp）。
      17/18 Router 无难度梯度使 inc−dec 对比结构性拉平。confirmed 未达，全局"无影响"亦不成立 → pending。
    status_reason: >-
      (1) confirmed 判据任何设置均未满足；(2) 主难度前提缺失（17/18 退化），confirmed 判据在本批 Router
