status_note: >
  R2（Router 码本坍塌与预处理效应）已执行完毕，纯 CPU 前向，未加载任何主干模型。18 个 Router（3K×2method×2preproc
  + 6 个 preproc=none 基座臂，共 18 个 .pt 全部从 Hub 自取，字节数与 Hub 元数据逐一相符）对 60×2048 entity_embeddings
  前向，取末层 softmax 计算熵/有效码字数/最大码字占比/Gini/落点直方图。结论：**pending（判据两族指标互相矛盾，
  不可判定）**，按指令 §4 判据规则严格落位，未升格、未证伪。三条主线事实：
  (1) **坍塌迹象成立**：全部 18 个 Router 的逐样本 softmax 饱和（平均熵 0.0000-0.0097 nats，exp(H)=1.0000-1.0098，
  top1≈1.000），exp(H) 不随 K 增长（K64/K8 比值 1.00-1.01），预登记坍塌判据 exp(H|K=64) < 2×exp(H|K=8) 在 4/4
  格成立——且属**全档位彻底坍塌**（K=8 时有效码字已≈1），比判据预设的"扩容不增容"更极端；原始输入臂 60 条样本
  几乎全部落向单一码字（raw/none 臂仅 1-2 个码字被使用）。
  (2) **预处理判据未达**：zscore 使 exp(H) 提升 ≥20% 的判据在 6/6 格失败（提升比 1.00-1.01），逐样本 z-score
  敏感性口径同样失败（exp(H) 1.000-1.063）。
  (3) **矛盾点（pending 的直接原因）**：码字**使用分布**层面 zscore 确有分散作用——K=64 时原始臂仅 1-2/64 个码字
  被使用（最大码字质量占比 0.983-1.000），zscore 臂 8-10/64 个（最大占比 0.279-0.283，Gini 0.918/0.913 vs
  0.984）；但逐样本熵指标已饱和，对该分散不敏感。两族指标对"zscore 是否缓解坍塌"给出相反答案，且 n=60 功效极低，
  按指令 §4"结果矛盾→pending"与 D1"测不出≠已证伪"落位 pending。
  【口径披露（D2）】指令未固定 z-score 公式：主口径=按特征数据集级 z-score（60 实体各维 mean/std），
  敏感性口径=逐样本 z-score，两者分列于 JSON sensitivity_persample_zscore，未静默替换。
  【架构口径披露】.pt 仅含 net.0/net.2（中间层无参数），训练脚本不在 Hub。主分析按"两层 MLP"标准读法
  Linear-ReLU-Linear；激活敏感性检查显示 ReLU 下 logits 达 O(10^2-10^3) 导致 softmax 饱和，Tanh 反事实下
  exp(H)=4.63-8.84 不饱和——即"逐样本 one-hot"这一发现**以标准读法为条件**，已就训练脚本/激活口径向 WB0 发
  open_item 1792661541-e8bdeb（不阻塞本轮交付）。
  【n 边界】n=60，仅机制观察，不得升格为结论；不得表述为"Router 已坍塌"或"zscore 无效/有效"。
prediction: >
  H-ROUTER-COLLAPSE：K 增大时有效码字数不按比例增长（扩容不增容）；zscore 预处理能缓解坍塌。
  预登记可观测形式：exp(H) 不随 K∈{8,16,64} 等比增长即坍塌迹象成立；zscore 臂 exp(H) 较 raw 臂提升 ≥20%
  即预处理有效。
falsifiable_criterion: >
  指令 §3 预登记判据，逐条执行：
  (a) 坍塌成立 ⇔ exp(H)|K=64 < 2×exp(H)|K=8（按 method×preproc 四格分别判定）；
  (b) 预处理有效 ⇔ zscore 使 exp(H) 提升 ≥20%（按 method×K 六格分别判定）；
  (c) confirmed = 观察到坍塌迹象**且** zscore 缓解（表述限"观察到坍塌迹象，需扩样本复核"）；
  (d) refuted = exp(H) 随 K 近似等比增长；
  (e) pending = 结果矛盾或样本不足。
  本轮执行结果：(a) 4/4 格成立（比值 1.00-1.01，属彻底坍塌而非部分缩放失效）；(b) 0/6 格成立（提升比 1.00-1.01）；
  (d) 不成立（exp(H) 全档贴 1.0，与等比增长相反）；故 (c) 因 (b) 失败不达 confirmed，(d) 明确不成立故不判 refuted，
  按 (e) 落 pending。
actual_data: >
  【输入与校验】entity_embeddings.json 自 Hub /api/file/r2_entity_embeddings 取得（60×2048，base64 fp32，
  解码后 sha256 前 16 位与文件内 emb_sha256 一致，全有限）；18 个 Router .pt 自 Hub /api/file/r2_b_routers/*
  取得（K8≈2.109MB/K16≈2.118MB/K64≈2.167MB，逐文件字节数与 Hub /api/files 元数据一致，均为 seed=20261020）。
  确定性：OMP/MKL=1、torch 单线程、manual_seed=20261020。
  【逐样本 softmax 统计（mean±range，18 配置）】平均熵 0.0000-0.0097 nats；exp(H)=1.0000-1.0098；
  mean top1 概率 0.995-1.000；即逐样本分布在标准 ReLU 读法下全部近 one-hot。
  【坍塌判据四格】diff_pr raw：expH K8=1.000/K64=1.000；diff_pr zscore：1.000/1.000；
  reinforce raw：1.000/1.000；reinforce zscore：1.000/1.010。比值均≈1.0 < 2 → 四格全部"观察到坍塌迹象"，
  但机制为 K=8 起即饱和（彻底坍塌），非判据预设的渐进扩容失效。
  【预处理判据六格】zscore/raw 提升比：diff_pr K8=1.00/K16=1.00/K64=1.00；reinforce K8=1.00/K16=1.00/K64=1.01。
  全部 <1.2 → 判据失败。
  【使用分布（直方图，60 样本 argmax 落点）】raw/none 臂：K8 diff_pr 59/60 落单码字#7；K8 reinforce 60/60 落 #3；
  K16 reinforce 60/60 落 #9；K64 diff_pr 60/60 落 #16；K64 reinforce 59/60 落 #32——1-2 个码字吃掉全部流量。
  zscore 臂：K8 diff_pr 用 3 码（32/21/7）；K16 diff_pr 用 5 码（28/15/6/...）；K64 diff_pr 用 10 码
  （top 17/60=0.283）；K64 reinforce 用 8 码（top 0.279）。最大码字质量占比：raw/none 0.983-1.000 →
  zscore 0.279-0.783；Gini：0.871-0.984 → 0.729-0.918。
  【敏感性】逐样本 z-score 口径 exp(H)=1.000-1.063，六格提升比仍 <1.2，判据结论不变。
  【激活敏感性】ReLU：logits |max| 804-1228，softmax 饱和；Tanh 反事实：exp(H)=4.63-8.84、top1=0.49-0.72，
  不饱和。"one-hot/坍塌"结论以标准 Linear-ReLU-Linear 读法为条件，训练脚本缺失已升 open_item。
  【n 边界】n=60；结论仅至机制观察级。
