verdict_summary: >
  结论 harming 三分法＝E5 撤回（终态），不可判而非已证伪。事实层面有三点可入账：(1) 死区不随幅度崩塌——把单单元扰动
  从 ±20% 推到 ±40%/+60%，U 臂 V5 主读数在两幅度下仍分别有 4/5 与 5/5 档出现 ≥3 个死区单元，覆盖口径重合度 76.7%/90.0%，
  refuted 分支两条均不成立；(2) 判据侧走的是 E5 而非 confirmed，唯一原因为 sd 门槛被 B=900 档 a=±40% 组击穿（0.0736）；
  (3) 该 sd 超标可定位到冻结件 L1 层 K=16 的单个实测点（ΔL=0.8352，为 K=32 处 0.0049 的 170 倍），剔除该层重算 sd=0.0041。
  因此：本次不能直接给 H-R1-DEADZONE-AMP 落 confirmed（判据未过），也不得因 sd 超标把它写成 refuted（死区未崩塌）；
  需要 WB0 先裁定 L1·K=16 单点是否可信，或补充中间 K 点后再重判。

caveats_and_degeneracies: |
  (1) 覆盖口径 vs 集中度口径：本轮落点全部采用 WB0 23:40 档钉死的覆盖口径 |死区∩低敏|/|低敏|（均值 76.7%/90.0%）；
      集中度口径（32.3%/34.8%）仅登记，未混入任何判据，对钉死口径无异议，故不发 open_item。
  (2) 「剔除 L1」为诊断口径、非主口径、不参与落点，其作用仅为把 E5 根因从「普遍不可分辨」收敛到「单点数据形态」；
      若据此改判 confirmed 属换口径冒充，本轮明确不这么做。
  (3) log2 插值是 EXP-16 已声明的连续化方式，非实测；K∈[1,32] 端点截断不外推，本轮闭合残差 9.09e-13、无记录被剔除。
  (4) ΔL 为单次实测且无 per-prompt CI，故本轮判据是计数型（死区单元数）而非效应量 CI 型，95% 描述区间不予给出，
      |Δ|<0.01 与测量噪声无法分离。
  (5) 非单调异常两处（未预先命名，保留待裁）：B=612 档 a=±40% 严格口径下死区为 0 而宽松口径（单方向）为 35；
      负方向在高预算档（612/900）死区数系统性低于正方向。二者均可能为水填充摊还量随 K 分布差异所致，本轮不断定成因。
  (6) 非主臂亦现 sd 超标（T 臂 180/324 档 sd=0.0783/0.0922），同属 L1 单点现象，仅登记。

