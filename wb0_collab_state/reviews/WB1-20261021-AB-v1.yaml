hypotheses:
- id: H-WB2-E2E-01
  prediction: 端到端检索 Reward 训练的 Router(B) 优于标签拟合 Router(A)，且可用更少群数。
  falsifiable_criterion: 真实多跳数据上 PR@5 对比 + 活跃群数对比（DEC-20261021-E2E-GATE：唯一升级依据）。
  actual_data: 真实 LongBench 2wikimqa（60 实体/30 查询/58 边，构造修正已披露）+ 真实 3B 隐状态 embedding：A（冻结件 argmax）recall@5=0.1333（4 活跃群）；best
    B（zscore 输入，K=64，可微 Pagerank reward）recall@5=0.4444（10 活跃群）；配对 bootstrap mean_diff=+0.3111，CI95=[+0.1667,+0.4778]，p_gt0=1.000（n=30）。K=16/8
    可微 PR 亦全胜 A（0.2833/0.2444，p=0.943/0.929）。'更少群数'子论断在 K=8 配置成立（3 活跃群 < A 的 4，且 recall 0.2444 > 0.1333）；best 配置（K=64）不满足（10
    > 4），已如实记录。对照 proxy（A=0.05/8、B=0.2125/6）方向一致。
  status: confirmed
  data_source: results_v2/wb1_ab_real_stage1.json
- id: H-AB-SOFT-HARD-TRANSFER
  prediction: 可微 soft reward 训练的信号可传导至 argmax 硬路由评估（soft 优化 ≠ 硬评估失效）。
  falsifiable_criterion: 训练后 argmax 硬路由 recall@5 应显著高于 soft_recall 训练值所暗示的水平（即硬评估不塌陷）。
  actual_data: zscore K64 可微 PR：soft_recall 收敛于 0.0947，同一步的 argmax 硬评估 recall@5=0.4444——硬传导显著优于软值（proxy 同向：soft 0.0999 vs
    hard 0.2125）。
  status: confirmed
  data_source: results_v2/wb1_ab_real_stage1.json
- id: H-NEW-INPUT-SCALE
  prediction: （post-hoc 发现，非预注册）真实 LLM 隐状态的大幅值/各向异性（范数 ~165）会使Router 初始 softmax 近均匀、共现邻接退化为全连接，导致可微 reward 训练停滞于 chance 水平；per-dim
    z-score 标准化可恢复训练信号。
  falsifiable_criterion: raw 输入下 soft_recall 应停滞（400 步无变化）；z-score 输入下 soft_recall 应持续上升。
  actual_data: raw：初始 logit_std=0.91、softmax 熵 3.808/max 4.158，soft_recall 0.0226→0.0224（400 步停滞，6 配置 recall 0.10-0.1333）；zscore：60
    步内 0.022→0.095 持续上升，最终 best B=0.4444。诊断与双口径结果均在主交付物 honesty_note ⑤。
  status: confirmed
  data_source: results_v2/wb1_ab_real_stage1.json
  note: post-hoc 诊断驱动的修正（仅改输入尺度，其余协议不变），raw 口径结果全部保留作对照。
- id: H-AB-REINFORCE-SECONDARY
  prediction: 次方法 REINFORCE+EMA+Gumbel 亦应显著优于 A（与可微 PR 主方法相当）。
  falsifiable_criterion: REINFORCE 配置 vs A 的配对 bootstrap 95% CI 应不含 0。
  actual_data: zscore K64 REINFORCE recall@5=0.1833 vs A 0.1333，mean_diff=+0.05，CI95=[-0.10,+0.20]，p_gt0=0.701——方向为正但不显著（n=30
    样本量小、稀疏 reward）。其余 K 更弱。
  status: pending
