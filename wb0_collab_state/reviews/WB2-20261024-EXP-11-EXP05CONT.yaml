observations: |
  1. 【口径修正的价值边界】本轮证实：把 PR@5 换成 MRR/全序 rank 能把判据动态范围从 0 恢复到 ~2.5–2.9pp（E5 分支不成立），
     但恢复的是「能否分辨」，不是「是否存在效应」——实测效应量 0（两臂 Δ 全 <0.6pp）。建议 WB0 在后续同类路线
     （R1 预算分配的 ΔL 三合成、R3 的 PR@5 饱和）中沿用连续口径，但须同时预注册效应阈值，否则「有范围无效应」会反复出现。
  2. 【机制读数，描述性，未预注册，不作判据】hop 越大 PPR 信号越弱：full 图 MRR 由 hop2 的 0.047224 降到 hop4 的 0.005858，
     而随机基线为 0.005680（比值 1.03）。即长程多跳链在本题内 title 共现图上基本不可解，两臂分配差异随之被压平。
     这解释了为何 Δ(hop) 在 hop=4 一律趋零，也提示「hop 调节效应」在本资产上可能本身不可观测（非判据缺陷）。
  3. 【k-core 退化，沿用原件披露】1306/1404 节点同为 9-core → top-X% by k-core 在 X≤92% 时接近层内按 node_id 选取
     （近任意选择），k-core 臂的解释力受限；community_bridge 为连续型区分度结构度量。两臂分别报数、未合并。
  4. 【口径分歧披露，请 WB0 裁定】指令 §3.2 写「dead-end→uniform teleport 1/N」，而 EXP-05 原件口径为「死点→保留节点内 uniform
     teleport」，且 §3.1 要求参数零改动 → 本轮主口径取原件口径，另跑 1/N 变体作敏感性：两变体 Δ 序列完全相同
     （kcore +0.1471/−0.1598/+0.0829、bridge −0.1450/+0.0290/−0.0565），分支归属不变 → 该分歧对本结论无影响。
