verdict: "H-EXP11-HOP-MODERATION-CONT = 持平（pending 枚举下）：k-core 与 community_bridge 两臂的 Δ(hop) 序列均落入指令 §5『持平』分支——|Δ(4)−Δ(2)| = 0.064pp / 0.089pp（<2pp）且 Δ 序列极差 = 0.307pp / 0.174pp（<2pp），无 ≥2pp 的 hop 调节效应。同时确认口径修正本身有效：PR@5 在 10 个配置上恒为 0（原件地板闸门），而连续口径 MRR 跨 (arm,X,hop) 极差达 2.9376pp / 2.4713pp（≥0.1pp），E5 撤回分支不成立。"
verdict_note: |
  1) status 取 pending 的理由（枚举映射，须先读本条）：指令 §5 给出四个分支（confirmed 增强 / refuted 衰减 / 持平 / E5 撤回），
     而回执模板 status 枚举只有 confirmed|refuted|e5_withdrawn|pending，『持平』无对应枚举值。
     按 D1（不得把未达判据写成 confirmed、也不得把测不出写成 refuted），本结果既不属增强也不属衰减，故落 pending，
     并在本字段与 hypotheses[0] 中显式写明『这是判据第四分支＝持平，不是执行缺口、不是功效不足回避』。
  2) 本 pending 不属指令 §5 所禁的『执行不完整』：120 任务 × 2 结构臂 × 3 hop × 3 预算档（+ 频次臂 3 档 + 全图参考）全覆盖，
     runtime 1.96s（预算 300s），无分批、无缩样、无中断，dependency_missing 为空。
  3) 功效披露（禁止把「持平」读成「两臂等价」）：每 (arm,hop) 三档合并配对样本 n=38–66，
     Δ 的 95% CI 半宽 0.079–0.360pp（例：kcore|hop=2 Δ=+0.2282pp，CI=[−0.0977,+0.5541]）。
     故结论应读作『在预注册 2pp 阈值下无 hop 调节效应』，而**不能**读作『已证明两臂等价』——
     本设计与样本量不足以排除 <2pp 量级的真实差异，等价性检验未做，未做即不宣称。
  4) 不代判：本令不改判 H-EXP-05-STRUCT-FREQ / H-EXP-05-HOP-MODERATION 的最终定级（scope_guard 3），
     也不把结果外延为『结构分配优于/劣于频次分配』之外的任何结论（scope_guard §9）。
