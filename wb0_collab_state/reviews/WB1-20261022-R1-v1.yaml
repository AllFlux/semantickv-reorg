hypotheses:
  - id: H-R1-BUDGET
    statement: 相同总 KV slot 预算下，按实测层敏感度反比分配（D）优于均匀（U）与教科书线性递减（T）。
    prediction: 在 L1/L2/L3 三种合成下 D 的合成 ΔL 均 < U 且 < T，且跨全部预算档一致。
    falsifiable_criterion: 任一合成下 D 不优于 U → refuted；三种合成排序互相矛盾或判据不可分辨 → pending。
    actual_data: >
      D 在全部非退化预算档三种合成下均优于 U，但 B=612/900 的 L1 合成上 T(7.733/7.202) 优于 D(8.927/8.963)，
      未达 confirmed；同时 L0 饱和使预算-质量单调性失效，判据在本数据上不可分辨 → pending（数据不足以判定）。
    ds_admitted_refutation: false
    ds_pending_reason: >
      非"三合成互相矛盾"，而是"判据可分辨性失效"：L0 饱和 + 33/35 层非单调，使排序建立在噪声实现之上。
      按 D1 结论三分，此为"测不出"，不得记为已证伪。
    status: pending
  - id: H-R1-L0SAT
    statement: L0 一旦被压缩即完全失效，其 ΔL 在 K=1..32 区间为饱和噪声，不携带压缩质量信息。
    prediction: 若成立，则 L0 的 answer_acc 在全部 6 档恒为 0、argmax_flip_rate 恒为 1.0，ΔL 呈非单调且跨档极差 >1。
    falsifiable_criterion: 若 L0 在任一大 K 档恢复 answer_acc=1 或 flip<1，则本假设不成立。
    actual_data: L0 acc 六档全 0、flip 六档全 1.0、ΔL 极差 3.950（7.0972-11.0473）→ 支持成立，confirmed。
    status: confirmed
  - id: H-R1-CHART
    statement: 指令 §2 所引 ascii_chart 的数值主张（L0/L1@K=1 均 ≥0.40；L24/25 中度 0.15-0.40；其余 <0.005）可由原始 cells 复现。
    prediction: 逐格复算后上述三条数值主张应全部成立。
    falsifiable_criterion: 任一条与原始 cells 复算值不符即证伪该条。
    actual_data: >
      L1@K=1=0.0220（称 ≥0.40，差 0.378，**不成立**）；L25 峰值 0.0750（称 0.15-0.40，**不成立**）；
      另有多层 ≥0.005（L19/20/21/27/28）。L0@K=1=8.7942 与 L24 峰值 0.1813 成立。
      三条中仅一条完全成立、一条部分成立、一条不成立；图中『两端各一簇』的定性形状仍成立。
    ds_admitted_refutation: true
    refutation_basis: >
      按指令 §2 要求『用原始 cells 复算验证该图』逐格复算后判定：数值主张层 refuted（L1@K=1 与 L25 峰值两条不成立），
      但定性形状层 holds。attribute 为指令文字转述（图本身无误），已发 open_item 1792639352-7b1c70 请 WB0 裁定是否属笔误。
    status: refuted
