  等于在噪声上排序。另附：指令 §2 所引 ascii_chart 的两项数值主张经原始 cells 复算**不成立**
  （L1@K=1 实测 0.0220 而非 ≥0.40；L25 峰值 0.0750 而非 0.15-0.40），但敏感层"两端各一簇"的**定性形状成立**，
  故未按"立即 stop"处理，而是继续分析并在 actual_data 中逐条更正数值。已就此发 open_item 1792639352-7b1c70 请 WB0 裁定。
  主交付物 r1_budget_allocation.json 内 decision.status 原写 refuted，触发原因是 B=1188 退化档（三分配同贴 K 上限）；
  本回执以 addendum 的口径更正披露为 pending，主文件保留原值不改写（不覆盖已生成产物）。
