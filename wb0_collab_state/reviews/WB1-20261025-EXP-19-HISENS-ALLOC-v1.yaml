verdict_summary: |
  落点 E5 撤回，命中分支②（composite 合成 sd > 0.05 致不可分辨，与 EXP-14/16 同症状）。
  如实登记三件事实，均不因落 E5 而抹去：
  (1) 效应点估计远超阈值：5/5 档 |ΔL1| ≥ 0.01，幅度 0.018~0.661，且 4/5 档同向为正
      （把预算补给 L1 使 composite 上升＝变差，即 L1 在低 K 处的强压缩收益被稀释）——
      这与「死区→不可压」的方向性预期相反，但未能通过 CI 判据，故不成立 confirmed。
  (2) 层维度 bootstrap 对单点主导统计量不适定：sens_L1=0.835 占指令给定敏感度质量的 67%，
      重采样时 L1 被抽中 0/1/2 次使 Σ 剧烈波动，sd_d 与 |mean_d| 同量级（0.32/0.33、0.66/0.66），
      CI 恒覆盖 0（B=180 下界 −0.0004，几乎恰好触 0）。这是判别力问题，不是效应不存在。
  (3) 通道分解给出 EXP-17 死区读数的正向支持：V3 通道（抽预算但不补给 L1）点估计 |Δ| ≤ 0.0052，
      即「从死区层抽走 20% 预算」本身无可分辨影响；可分辨效应全部来自「补给 L1」。
  机制含义：可压/不可压边界不是「死区层不可动」而是「重分配的接收端决定效应」——
  把槽位挪向最敏感层会显著改变 composite，挪向其余层则不产生可分辨变化。
  判据冲突已显式登记（E5② 与 refuted 第一子句同时命中，见 criterion_branch_conflict），请 WB0 裁定。
